<div class="login-page dashboard_backgroud">
  <div class="login-box">
    <!-- /.login-logo -->
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <a href="#" class="h1">
          SM Treading
        </a>
      </div>
      <div class="card-body">

        <form (ngSubmit)="onLogin(login)">
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Email or username" name="email"
              [(ngModel)]="login.username" required="">
          </div>

          <div class="input-group mb-3">
            <input type="password" class="form-control" placeholder="Password" name="password"
              [(ngModel)]="login.password" required="">
          </div>

          <div class="row">
            <div class="col-8">
              <input type="checkbox" name="rememberMe" [(ngModel)]="login.rememberMe">
              <label>Remember Me</label>
            </div>
            <!-- /.col -->
            <div class="col-4">
              <button type="submit" class="btn btn-primary btn-block">
                Login
              </button>
            </div>
            <!-- /.col -->
          </div>
        </form>


        <p class="mb-1">
          <a href="forgot-password.html">I forgot my password</a>
        </p>

      </div>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->
  </div>

</div>
