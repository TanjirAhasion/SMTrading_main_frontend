<div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><h1 class="m-0 font-weight-bold"><i class="fas fa-history mr-2 text-info"></i>Rental History Report</h1></div></div>
    <section class="content"><div class="container-fluid">
        <div class="card shadow-sm border-0 mb-3"><div class="card-body py-3"><form [formGroup]="filterForm" class="row align-items-end">
            <div class="col-md-4 mb-2"><label>Customer</label><select class="form-control" formControlName="customerId"><option value="">All</option>@for (c of customers; track c.id) {<option [value]="c.id">{{ c.companyName || (c.firstName + ' ' + c.lastName) }}</option>}</select></div>
            <div class="col-md-2 mb-2"><label>From</label><input type="date" class="form-control" formControlName="fromDate"></div>
            <div class="col-md-2 mb-2"><label>To</label><input type="date" class="form-control" formControlName="toDate"></div>
            <div class="col-md-4 mb-2 text-right"><button type="button" class="btn btn-info mr-2" (click)="page=1; loadReport()">Search</button><button type="button" class="btn btn-default border mr-2" (click)="reset()">Reset</button><button type="button" class="btn btn-success mr-2" (click)="export('excel')">Excel</button><button type="button" class="btn btn-danger" (click)="export('pdf')">PDF</button></div>
        </form></div></div>
        <div class="card card-outline card-info shadow-sm"><app-report-table [columns]="columns" [rows]="rows" [loading]="loading" [page]="page" [pageSize]="pageSize" [totalCount]="totalCount" [sortBy]="sortBy" [sortDirection]="sortDirection" (pageChange)="pageChange($event)" (sortChange)="sortChange($event)"></app-report-table></div>
    </div></section>
</div>
