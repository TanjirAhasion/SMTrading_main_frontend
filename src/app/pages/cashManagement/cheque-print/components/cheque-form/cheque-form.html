<div class="card cheque-panel no-print">
  <div class="card-header bg-white">
    <h3 class="card-title mb-0">
      <i class="fas fa-university text-info mr-2"></i>
      Cheque Setup
    </h3>
  </div>

  <div class="card-body">
    <div class="form-group">
      <label>Bank Template</label>
      <select class="form-control" [ngModel]="selectedTemplate.id" (ngModelChange)="onTemplateChange($event)">
        @for (template of templates; track template.id) {
        <option [value]="template.id">{{ template.bankName }} - {{ template.accountName }}</option>
        }
      </select>
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label>X Offset (mm)</label>
        <input type="number" class="form-control" [(ngModel)]="selectedTemplate.calibration.xOffset"
          (ngModelChange)="positionChange.emit()" step="0.5">
      </div>
      <div class="form-group col-md-6">
        <label>Y Offset (mm)</label>
        <input type="number" class="form-control" [(ngModel)]="selectedTemplate.calibration.yOffset"
          (ngModelChange)="positionChange.emit()" step="0.5">
      </div>
    </div>

    <hr>

    <div class="form-group">
      <label>Payee Name</label>
      <input type="text" class="form-control" [(ngModel)]="cheque.payeeName" (ngModelChange)="updateCheque()"
        placeholder="Enter payee name">
    </div>

    <div class="form-row">
      <div class="form-group col-md-6">
        <label>Amount</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text">Tk</span>
          </div>
          <input type="number" class="form-control text-right" [(ngModel)]="cheque.amount"
            (ngModelChange)="updateAmount()" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="form-group col-md-6">
        <label>Date</label>
        <input type="date" class="form-control" [(ngModel)]="cheque.chequeDate" (ngModelChange)="updateCheque()">
      </div>
    </div>

    <div class="form-group">
      <label>Amount In Words</label>
      <textarea class="form-control" rows="3" [(ngModel)]="cheque.amountInWords" (ngModelChange)="updateCheque()"
        placeholder="Amount in words"></textarea>
    </div>

    <hr>

    <div class="position-editor">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <label class="mb-0">Position Editor</label>
        <span class="badge badge-light border">{{ fieldLabel }}</span>
      </div>

      <div class="form-group">
        <select class="form-control" [ngModel]="selectedField" (ngModelChange)="selectedFieldChange.emit($event)">
          @for (field of fieldKeys; track field) {
          <option [value]="field">{{ toLabel(field) }}</option>
          }
        </select>
      </div>

      <div class="form-row">
        <div class="form-group col-6">
          <label>Top</label>
          <input type="number" class="form-control" [(ngModel)]="selectedTemplate.fields[selectedField].top"
            (ngModelChange)="positionChange.emit()" step="0.5">
        </div>
        <div class="form-group col-6">
          <label>Left</label>
          <input type="number" class="form-control" [(ngModel)]="selectedTemplate.fields[selectedField].left"
            (ngModelChange)="positionChange.emit()" step="0.5">
        </div>
        <div class="form-group col-6">
          <label>Width</label>
          <input type="number" class="form-control" [(ngModel)]="selectedTemplate.fields[selectedField].width"
            (ngModelChange)="positionChange.emit()" step="0.5">
        </div>
        <div class="form-group col-6">
          <label>Font</label>
          <input type="number" class="form-control" [(ngModel)]="selectedTemplate.fields[selectedField].fontSize"
            (ngModelChange)="positionChange.emit()" step="0.1">
        </div>
      </div>
    </div>
  </div>

  <div class="card-footer bg-white">
    <div class="d-flex flex-wrap action-row">
      <button type="button" class="btn btn-outline-secondary" (click)="reset.emit()">
        <i class="fas fa-undo mr-1"></i> Reset
      </button>
      <button type="button" class="btn btn-outline-info" (click)="saveTemplate.emit()">
        <i class="fas fa-save mr-1"></i> Save Template
      </button>
      <button type="button" class="btn btn-outline-dark" (click)="downloadTemplate.emit()">
        <i class="fas fa-download mr-1"></i> JSON
      </button>
      <label class="btn btn-outline-dark mb-0">
        <i class="fas fa-upload mr-1"></i> Load
        <input type="file" accept="application/json" hidden (change)="onTemplateFileSelected($event)">
      </label>
      <button type="button" class="btn btn-danger ml-auto" (click)="exportPdf.emit()">
        <i class="fas fa-file-pdf mr-1"></i> PDF
      </button>
      <button type="button" class="btn btn-success" (click)="print.emit()">
        <i class="fas fa-print mr-1"></i> Print
      </button>
    </div>
  </div>
</div>
